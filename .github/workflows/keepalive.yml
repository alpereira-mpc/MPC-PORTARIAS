name: Keep Streamlit App Alive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Open the keep-alive endpoint
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          url = "https://ferramentasmpcpb.streamlit.app/?keepalive=1"
          expected_text = "Keep Alive OK"

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              page = browser.new_page()
              try:
                  page.goto(url, wait_until="domcontentloaded", timeout=120_000)
                  page.get_by_text(expected_text).first.wait_for(
                      state="visible", timeout=120_000
                  )
                  page.wait_for_timeout(20_000)
              except Exception:
                  print(f"Final URL: {page.url}")
                  try:
                      print(f"Page title: {page.title()}")
                  except Exception as title_error:
                      print(f"Page title unavailable: {title_error}")
                  try:
                      visible_text = page.locator("body").inner_text(timeout=10_000)
                      print("Visible page text (first 2000 characters):")
                      print(visible_text[:2_000])
                  except Exception as text_error:
                      print(f"Visible page text unavailable: {text_error}")
                  try:
                      page.screenshot(path="keepalive-failure.png", full_page=True)
                      print("Failure screenshot saved to keepalive-failure.png")
                  except Exception as screenshot_error:
                      print(f"Failure screenshot unavailable: {screenshot_error}")
                  raise
              finally:
                  browser.close()
          PY

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-failure-screenshot
          path: keepalive-failure.png
          if-no-files-found: warn
