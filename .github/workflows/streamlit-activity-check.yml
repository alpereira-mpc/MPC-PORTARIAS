name: Streamlit activity check

on:
  schedule:
    # Four-hour cadence, deliberately outside minute zero.
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamlit-activity-check
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Configure this repository variable with the public Streamlit URL.
      STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install isolated browser checker dependencies
        run: npm install --no-save --ignore-scripts playwright@1.52.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Streamlit session and activity
        run: node scripts/streamlit_activity_check.mjs
