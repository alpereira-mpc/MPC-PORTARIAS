# Copy to secrets.toml and fill with real values. Do not commit secrets.toml.

[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "generate-a-long-random-string"
client_id = "GOOGLE_OAUTH_CLIENT_ID"
client_secret = "GOOGLE_OAUTH_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# Production example (Streamlit Community Cloud Secrets):
# redirect_uri = "https://ferramentasmpcpb.streamlit.app/oauth2callback"
#
# DATABASE_URL remains the existing PostgreSQL/Supabase connection string.
# Do not put Google Client Secret in git, logs or this example as a real value.
#
# Optional SMTP used only to notify mpc@tce.pb.gov.br of public access requests.
# Do not put real passwords here. Register the values in Secrets or environment.
# [smtp]
# host = "SMTP_HOST"
# port = 587
# username = "SMTP_USERNAME"
# password = "SMTP_PASSWORD"
# from_address = "SMTP_FROM_ADDRESS"
#
# Institutional send is separate from the login OAuth above and from SMTP.
# Use only one mode. The sender must stay mpc@tce.pb.gov.br.
# Never commit client secrets, private keys or refresh tokens.
#
# Proof of concept: OAuth granted by the institutional mailbox, scope gmail.send only.
# Obtain the refresh token with scripts/gmail_oauth_bootstrap.py and paste it in Secrets.
# [gmail_send]
# enabled = false
# mode = "user_oauth"
# sender = "mpc@tce.pb.gov.br"
# client_id = "GMAIL_SEND_CLIENT_ID"
# client_secret = "GMAIL_SEND_CLIENT_SECRET"
# refresh_token = "GMAIL_SEND_REFRESH_TOKEN"
#
# Future alternative: Workspace service account with domain-wide delegation.
# [gmail_send]
# enabled = false
# mode = "service_account"
# sender = "mpc@tce.pb.gov.br"
# service_account = """{"type":"service_account","client_email":"...","private_key":"..."}"""

# Laboratório de IA (protótipo administrativo). Optional.
# Add this entry manually in secrets.toml or in Streamlit Cloud Secrets.
# Do not commit a real key. The application keeps working when it is absent.
# Name: GEMINI_API_KEY
